# Configuration for Philadelphia Meeting Agenda Tracker
#
# Each meeting has:
#   - name: Full name of the meeting body
#   - url: URL to fetch agendas from
#   - scraper: Which scraper class to use
#   - pdf_pattern: Pattern to identify agenda PDFs
#   - focus: Summarization focus (housing, design, historic, transportation, general)
#   - enabled: Whether to include in batch runs (true/false)

meetings:
  pcpc:
    name: "Philadelphia City Planning Commission"
    url: "https://www.phila.gov/departments/philadelphia-city-planning-commission/public-meetings/"
    scraper: "phila_gov"
    pdf_pattern: "PCPC-Agenda"
    focus: "housing"
    enabled: true

  cdr:
    name: "Civic Design Review"
    url: "https://www.phila.gov/departments/philadelphia-city-planning-commission/public-meetings/"
    scraper: "phila_gov"
    pdf_pattern: "CDR"
    focus: "design"
    enabled: true

  historical_commission:
    name: "Historical Commission"
    url: "https://www.phila.gov/departments/philadelphia-historical-commission/public-meetings/"
    scraper: "phila_gov"
    pdf_pattern: "HC-"
    focus: "historic"
    enabled: true

  historical_arch:
    name: "Historical Commission - Architecture Committee"
    url: "https://www.phila.gov/departments/philadelphia-historical-commission/public-meetings/"
    scraper: "phila_gov"
    pdf_pattern: "architecture"
    focus: "historic"
    enabled: false  # Architecture committee may not have separate agendas

  art_commission:
    name: "Art Commission"
    url: "https://www.phila.gov/departments/philadelphia-art-commission/public-meetings/"
    scraper: "phila_gov"
    pdf_pattern: "Art-Commission-Agenda"
    focus: "design"
    enabled: true

  zba:
    name: "Zoning Board of Adjustment"
    url: "https://li.phila.gov/zba-appeals-calendar"
    scraper: "phila_gov"
    pdf_pattern: "agenda"
    focus: "housing"
    enabled: false  # Uses JavaScript calendar - ALTERNATIVE: Use existing ZBA project data
    # NOTE: Construct weekly hearing digest from existing ZBA case compilation project
    # Project contains hearing dates - can generate "upcoming hearings this week" digest

  city_council_rules:
    name: "City Council Rules Committee"
    url: "https://phila.legistar.com/Calendar.aspx"
    scraper: "legistar"
    pdf_pattern: "Rules"
    committee_keywords: ["Rules", "Committee on Rules"]
    focus: "general"
    enabled: false  # Legistar complex - needs refinement

  city_council_streets:
    name: "City Council Streets Committee"
    url: "https://phila.legistar.com/Calendar.aspx"
    scraper: "legistar"
    pdf_pattern: "Streets"
    committee_keywords: ["Streets", "Committee on Streets", "Streets and Services"]
    focus: "general"
    enabled: false  # Legistar complex - needs refinement

  # NOTE: Housing Advisory Board removed - quarterly virtual meetings with no votes
  # Use RCO email monitor instead if needed

  septa:
    name: "SEPTA Board"
    url: "https://www.septa.org/about/board/"
    scraper: "septa"
    pdf_pattern: "agenda"
    focus: "transportation"
    enabled: false  # Inconsistent PDF structure - add to RCO email monitor instead

  pra:
    name: "Philadelphia Redevelopment Authority"
    url: "https://phdcphila.org/philadelphia-redevelopment-authority-board/"
    scraper: "phdc"
    pdf_pattern: "PRA-Board-Agenda"
    focus: "housing"
    enabled: true  # PHDC scraper now implemented

  land_bank:
    name: "Philadelphia Land Bank"
    url: "https://phillylandbank.org/philadelphia-land-bank-board/"
    scraper: "land_bank"
    pdf_pattern: "agenda"
    focus: "housing"
    enabled: true  # Board page found with 2025 agendas - will get 2026 when posted

  phrc:
    name: "Philadelphia Housing Redevelopment Corp"
    url: "https://phdcphila.org/"
    scraper: "phdc"
    pdf_pattern: "PHRC"
    focus: "housing"
    enabled: false  # Need to find correct agenda page

# Global settings
settings:
  output_dir: "summaries"
  save_pdfs: false  # Whether to keep downloaded PDFs
  create_google_docs: false  # Enable when Google Docs setup is complete

# RCO Newsletter Monitoring
# Also monitors: Land Bank agendas, SEPTA board notices (received via email)
rco_monitoring:
  enabled: true
  gmail_credentials: "gmail-credentials.json"  # OAuth2 credentials from Google Cloud
  output_dir: "summaries/rco"  # Where to save RCO meeting data
  max_emails: 500  # Maximum emails to fetch per check
  search_query: null  # Optional Gmail search query (e.g., "from:*@phillyneighborhoods.org")
  label_processed: true  # Add "RCO-Meeting" label to processed emails
  check_frequency: "daily"  # How often to check (for documentation only)

  # Additional email sources to subscribe to:
  # - Philadelphia Land Bank board agendas (monthly)
  # - SEPTA board meeting notices
  # - Individual RCO newsletters (200+)

  # Keywords for relevance filtering (used by Claude AI)
  relevant_keywords:
    - zoning
    - variance
    - development
    - construction
    - bike lane
    - protected bike lane
    - transit
    - SEPTA
    - street redesign
    - road diet
    - parking
    - housing
    - land use
    - "land bank"  # Catch Land Bank emails
    - "board meeting"  # Catch official board notices
