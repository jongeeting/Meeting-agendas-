# Configuration for Philadelphia Meeting Agenda Tracker
#
# Each meeting has:
#   - name: Full name of the meeting body
#   - url: URL to fetch agendas from
#   - scraper: Which scraper class to use
#   - pdf_pattern: Pattern to identify agenda PDFs
#   - focus: Summarization focus (housing, design, historic, transportation, general)
#   - enabled: Whether to include in batch runs (true/false)

meetings:
  pcpc:
    name: "Philadelphia City Planning Commission"
    url: "https://www.phila.gov/departments/philadelphia-city-planning-commission/public-meetings/"
    scraper: "phila_gov"
    pdf_pattern: "PCPC-Agenda"
    focus: "housing"
    enabled: true

  cdr:
    name: "Civic Design Review"
    url: "https://www.phila.gov/departments/philadelphia-city-planning-commission/public-meetings/"
    scraper: "phila_gov"
    pdf_pattern: "CDR"
    focus: "design"
    enabled: true

  historical_commission:
    name: "Historical Commission"
    url: "https://www.phila.gov/departments/philadelphia-historical-commission/public-meetings/"
    scraper: "phila_gov"
    pdf_pattern: "HC-"
    focus: "historic"
    enabled: true

  historical_arch:
    name: "Historical Commission - Architecture Committee"
    url: "https://www.phila.gov/departments/philadelphia-historical-commission/public-meetings/"
    scraper: "phila_gov"
    pdf_pattern: "architecture"
    focus: "historic"
    enabled: false  # Architecture committee may not have separate agendas

  art_commission:
    name: "Art Commission"
    url: "https://www.phila.gov/departments/philadelphia-art-commission/public-meetings/"
    scraper: "phila_gov"
    pdf_pattern: "Art-Commission-Agenda"
    focus: "design"
    enabled: true

  zba:
    name: "Zoning Board of Adjustment"
    url: "https://www.phila.gov/departments/zoning-board-of-adjustment/public-meetings/"
    scraper: "phila_gov"
    pdf_pattern: "agenda"
    focus: "housing"
    enabled: true

  city_council_rules:
    name: "City Council Rules Committee"
    url: "https://phila.legistar.com/Calendar.aspx"
    scraper: "legistar"
    pdf_pattern: "Rules"
    committee_keywords: ["Rules", "Committee on Rules"]
    focus: "general"
    enabled: true  # Legistar scraper now implemented

  city_council_streets:
    name: "City Council Streets Committee"
    url: "https://phila.legistar.com/Calendar.aspx"
    scraper: "legistar"
    pdf_pattern: "Streets"
    committee_keywords: ["Streets", "Committee on Streets", "Streets and Services"]
    focus: "general"
    enabled: true  # Legistar scraper now implemented

  housing_advisory:
    name: "Philadelphia Housing Advisory Board"
    url: "https://www.phila.gov/departments/division-of-housing-and-community-development/about/housing-advisory-board/"
    scraper: "phila_gov"
    pdf_pattern: "Housing-Advisory"
    focus: "housing"
    enabled: true

  septa:
    name: "SEPTA Board"
    url: "https://www.septa.org/board/meetings.html"
    scraper: "septa"
    pdf_pattern: "agenda"
    focus: "transportation"
    enabled: true  # SEPTA scraper now implemented

  pra:
    name: "Philadelphia Redevelopment Authority"
    url: "https://phdcphila.org/philadelphia-redevelopment-authority-board/"
    scraper: "phdc"
    pdf_pattern: "PRA-Board-Agenda"
    focus: "housing"
    enabled: true  # PHDC scraper now implemented

  land_bank:
    name: "Philadelphia Land Bank"
    url: "https://phdcphila.org/who-we-are/boards/philadelphia-land-bank-board/"
    scraper: "phdc"
    pdf_pattern: "PLB-Board"
    focus: "housing"
    enabled: true  # Board agendas available at phdcphila.org

  phrc:
    name: "Philadelphia Housing Redevelopment Corp"
    url: "https://phdcphila.org/"
    scraper: "phdc"
    pdf_pattern: "PHRC"
    focus: "housing"
    enabled: false  # Need to find correct agenda page

# Global settings
settings:
  output_dir: "summaries"
  save_pdfs: false  # Whether to keep downloaded PDFs
  create_google_docs: false  # Enable when Google Docs setup is complete
